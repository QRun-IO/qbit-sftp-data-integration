schema: 1

scoped_delegation: true

verification:
  push:
    branches: [main, master, dev, rc, "release/**", "hotfix/**", "qualification/**"]

components:
  library:
    directory: .
    platforms: [linux-amd64]
    toolchains:
      java: "21"
    build:
      tool: maven
      # Shared verification uses the release version property so unchanged tested outputs can be reused.
      commands:
        - ["--batch-mode", "--update-snapshots", "-T4", "--no-transfer-progress", "verify"]
        - ["--batch-mode", "--no-transfer-progress", "org.codehaus.mojo:flatten-maven-plugin:1.7.3:flatten", "-Dflatten.mode=resolveCiFriendliesOnly", "-DupdatePomFile=true"]
    reports:
      junit: "**/target/surefire-reports/*.xml"
    artifacts:
      packages:
        format: maven
        # Retain the generated consumer POM alongside the tested JAR; both are required for publication.
        paths: [".flattened-pom.xml", "target/*.jar"]

release:
  channels:
    snapshot:
      trigger:
        push_branches: [develop]
      versioning: maven-snapshot
      effective_version:
        rule: develop-next-minor
      central_completion: true
      version_write_back: {}
    # Release candidates: a push to release/X.Y derives X.Y.0-RC.n with the existing rc-from-branch rule (the first RC of a branch that declares
    # X.Y.Z-SNAPSHOT is RC.1); maven-release refuses a SNAPSHOT effective version. Published to the same destination as the snapshot, with the same
    # Central completion and source write-back policy.
    release-candidate:
      trigger:
        push_branches: ["release/*"]
      versioning: maven-release
      effective_version:
        rule: rc-from-branch
      central_completion: true
      version_write_back: {}
  publications:
    qbit-sftp-packages:
      component: library
      artifact: packages
      destination: qrun-maven
      channels: [snapshot, release-candidate]
